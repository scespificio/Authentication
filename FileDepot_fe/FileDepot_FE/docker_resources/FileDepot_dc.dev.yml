#docker compose -f docker-compose.dev.yml up --build

networks:
  filedepot_net:
    external: false

services:
  filedepot_fe_dev:
    build:
      context: /home/adminroot/workspace/FileDepot/FileDepot_fe/FileDepot_FE/
      dockerfile: docker_resources/Dockerfile
      target: dev
    image: filedepot_fe:dev
    container_name: filedepot_fe_dev
    ports:
      - "5183:5183"
    env_file:
      - /home/adminroot/workspace/services/env/FileDepot.env.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - /home/adminroot/workspace/FileDepot/FileDepot_fe/FileDepot_FE/:/app
      - /app/node_modules
    networks:
      - filedepot_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped